# Reverse proxy davanti al container del sito (servizio "sito" della rete compose)

# HTTP: rinnovo certificati + redirect a HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name marcopanunzio.it www.marcopanunzio.it;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://marcopanunzio.it$request_uri;
    }
}

# www → dominio principale
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.marcopanunzio.it;

    ssl_certificate     /etc/letsencrypt/live/marcopanunzio.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marcopanunzio.it/privkey.pem;

    return 301 https://marcopanunzio.it$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name marcopanunzio.it;

    ssl_certificate     /etc/letsencrypt/live/marcopanunzio.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marcopanunzio.it/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # niente includeSubDomains: eventuali sottodomini della mail restano liberi
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        proxy_pass http://sito:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
