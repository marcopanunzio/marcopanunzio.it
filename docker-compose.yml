# Locale:  docker compose up -d --build            → http://localhost:8080
# VPS:     docker compose --profile vps up -d --build  (vedi README, sezione Deploy)
services:
  sito:
    build: .
    image: marcopanunzio-it
    container_name: marcopanunzio-it
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"

  proxy:
    profiles: [vps]
    image: nginx:1.29-alpine
    container_name: marcopanunzio-proxy
    restart: unless-stopped
    depends_on: [sito]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
    # ricarica periodica per adottare i certificati rinnovati
    command: /bin/sh -c 'while :; do sleep 6h; nginx -s reload; done & exec nginx -g "daemon off;"'

  certbot:
    profiles: [vps]
    image: certbot/certbot:v5.1.0
    container_name: marcopanunzio-certbot
    restart: unless-stopped
    volumes:
      - ./deploy/certbot/conf:/etc/letsencrypt
      - ./deploy/certbot/www:/var/www/certbot
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'
